[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaonuan-qqbot"
version = "0.1.0"
description = "小暖：私聊陪伴 QQ 机器人"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nonebot2[fastapi]>=2.4,<3",
  "nonebot-adapter-onebot>=2.4,<3",
  "openai>=1.60,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "Pillow>=11,<13",
  "edge-tts>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.27,<1", "websockets>=14,<17"]

[tool.setuptools.packages.find]
include = ["qqbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
